AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Run the ThermaGuard FastAPI app with the local AWS SAM simulator.

Globals:
  Function:
    Runtime: python3.13
    MemorySize: 512
    Timeout: 30

Resources:
  ThermaGuardApi:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: app.lambda_handler.handler
      Environment:
        Variables:
          APP_ENV: development
          DATABASE_URL: sqlite:////tmp/coolblock.db
      Events:
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
